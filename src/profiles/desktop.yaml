profile:
  name: "Basic Desktop Environment"
  description: "Basic Desktop"

packages:
  - vim
  - git
  - networkmanager
  - xorg
  - nano
  - xorg-server
  - xorg-xinit
  - xinit
  - noto-fonts

services:
  - NetworkManager

post_install_commands:
  - echo "Welcome to Fyntora Linux!" > /etc/motd

post_configuration_commands:
  - tocuh ~/.xinitrc
  - echo exec ~/.defined/fyn-window-manager/fynwindow-manager > ~/xinitrc